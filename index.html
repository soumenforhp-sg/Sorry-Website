<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loading ❤️</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- Animated Background -->
    <div class="loading-background"></div>

    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Main Loading Card -->
    <div class="loading-container">

        <!-- Logo -->
        <div class="logo-container">

            <div class="heart-loader">

                ❤️

            </div>

        </div>

        <!-- Title -->
        <h1 class="loading-title">

            Preparing Something Special...

        </h1>

        <p class="loading-subtitle">

            Every heartbeat carries
            an apology from my heart.

        </p>

        <!-- Progress -->
        <div class="progress-wrapper">

            <div class="progress-bar">

                <div id="progressFill"
                     class="progress-fill">

                </div>

            </div>

            <div id="loadingPercent"
                 class="loading-percent">

                0%

            </div>

        </div>

        <!-- Loading Message -->
        <div id="loadingMessage"
             class="loading-message">

            Loading beautiful memories...

        </div>

    </div>

    <!-- Decorative Hearts -->
    <div class="corner-heart top-left">💖</div>
    <div class="corner-heart top-right">🌹</div>
    <div class="corner-heart bottom-left">💕</div>
    <div class="corner-heart bottom-right">✨</div>

    <!-- Scripts -->
    <script src="js/loading.js"></script>

</body>

</html>
